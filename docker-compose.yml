services:
  postgres:
    image: postgres:16
    container_name: fintrack-postgres
    environment:
      POSTGRES_DB: fintrack_db
      POSTGRES_USER: fintrack_user
      POSTGRES_PASSWORD: fintrack_password
    ports:
      - "5433:5432"
    volumes:
      - fintrack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack_user -d fintrack_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fintrack-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fintrack_db
      SPRING_DATASOURCE_USERNAME: fintrack_user
      SPRING_DATASOURCE_PASSWORD: fintrack_password
      APP_JWT_SECRET: local-development-secret-change-me-at-least-32-chars
      APP_JWT_ACCESS_TOKEN_EXPIRATION_MS: 3600000
    ports:
      - "8080:8080"

volumes:
  fintrack_postgres_data:
