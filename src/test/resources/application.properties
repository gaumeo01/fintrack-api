spring.datasource.url=jdbc:h2:mem:fintrack_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-secret-for-jwt-token-generation-at-least-32-characters
app.jwt.access-token-expiration-ms=3600000
