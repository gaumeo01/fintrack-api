spring.application.name=finance-tracker

spring.datasource.url=jdbc:postgresql://localhost:5433/fintrack_db
spring.datasource.username=fintrack_user
spring.datasource.password=fintrack_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration-ms=${APP_JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
