spring.application.name=finance-tracker

spring.datasource.url=jdbc:postgresql://localhost:5433/fintrack_db
spring.datasource.username=fintrack_user
spring.datasource.password=fintrack_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=change-this-development-secret-to-a-long-random-production-secret
app.jwt.access-token-expiration-ms=3600000
